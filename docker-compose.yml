version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prompttoppt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompttoppt
      POSTGRES_PASSWORD: prompttoppt_dev_password
      POSTGRES_DB: prompttoppt_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prompttoppt']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prompttoppt-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
