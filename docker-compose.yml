# Local infrastructure. No Docker? Run `pnpm db:local` for an embedded Postgres on the same port/credentials.
# Redis intentionally absent: nothing needs it yet (queue = SQS, rate limiting is in-process). Add it with the feature that needs it.
services:
  postgres:
    image: postgres:16-alpine
    container_name: prompttoppt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompttoppt
      POSTGRES_PASSWORD: prompttoppt_dev_password
      POSTGRES_DB: prompttoppt_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prompttoppt']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
