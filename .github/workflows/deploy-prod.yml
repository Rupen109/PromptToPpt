name: Deploy (production)

# Started by hand: GitHub -> Actions -> "Deploy (production)" -> Run workflow. Nothing deploys on its own.
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'What to deploy'
        type: choice
        default: 'api web editor'
        options:
          - 'api web editor'
          - 'api'
          - 'web'
          - 'editor'
          - 'server'
          - 'config'
      release:
        description: 'Release build: the website build fails while an owner field in apps/web/lib/legal.ts is still TODO (tick it for the public launch and every deploy after)'
        type: boolean
        default: false

# the workflow token can only read the repository
permissions:
  contents: read

# one deploy at a time
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # ARM runner: the server is an ARM machine, so the images are built natively (no slow emulation)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: production
    env:
      AWS_REGION: ap-southeast-2
      ENVNAME: prod
      DOMAIN: slidesdone.app
      NEXT_PUBLIC_GOOGLE_AUTH: 'true'
      NEXT_PUBLIC_MICROSOFT_AUTH: 'false'
      RELEASE: ${{ inputs.release && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_PROD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # release builds only: stop here, before any image is built, if the legal pages still have placeholders
      - name: Legal pages are ready
        if: inputs.release
        run: RELEASE_CHECK=1 node scripts/check-legal.mjs
      - name: Build, publish and restart
        run: infra/prod/deploy.sh ${{ inputs.what }}
