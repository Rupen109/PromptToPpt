name: CI
# The checks every change must pass (docs/RELEASES.md): type check, lint, unit tests, build, dependency audit, secret scan.
#   · every pull request into qa or master, and every push to qa (qa deploys nothing: the owner tests it on their own machine)
#   · every push to master: the deploy workflow runs this first and deploys only when it passes (workflow_call)
#   · by hand (Actions -> CI -> Run workflow), with the legal release check as an option
on:
  pull_request:
    branches: [qa, master]
  push:
    branches: [qa]
  workflow_call:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release check: also fail while an owner field in apps/web/lib/legal.ts is still TODO'
        type: boolean
        default: false

# least privilege: the workflow token can only read the repository
permissions:
  contents: read

concurrency:
  # a newer push to the same branch replaces a run still going (a deploy's own CI is part of the deploy's group instead)
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: prompttoppt, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: prompttoppt_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prompttoppt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      EDITOR_URL: http://localhost:3001
      DATABASE_URL: postgresql://prompttoppt:ci_password@localhost:5432/prompttoppt_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # the legal pages' own unit tests always run; the release check (placeholders still TODO) only when this run was started as a release check
      - run: pnpm test:legal
      - if: inputs.release
        run: RELEASE_CHECK=1 pnpm check:legal
      # known-vulnerable production dependencies fail the build (high and above)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # scans the full history for committed credentials (API keys, tokens, private keys)
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
