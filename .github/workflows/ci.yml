name: CI
# PAUSED (2026-10-31): it ran on every push and failed. It now only runs when started by hand (Actions -> CI -> Run workflow).
# To switch it back on, replace `workflow_dispatch:` with the two lines below.
#   push: { branches: [master] }
#   pull_request:
on:
  workflow_dispatch:

# least privilege: the workflow token can only read the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: prompttoppt, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: prompttoppt_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prompttoppt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      EDITOR_URL: http://localhost:3001
      DATABASE_URL: postgresql://prompttoppt:ci_password@localhost:5432/prompttoppt_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # known-vulnerable production dependencies fail the build (high and above)
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # scans the full history for committed credentials (API keys, tokens, private keys)
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
