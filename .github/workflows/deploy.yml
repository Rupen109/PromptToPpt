name: Deploy (test environment)

# Started by hand: GitHub -> Actions -> "Deploy (test environment)" -> Run workflow. Nothing deploys on its own.
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'What to deploy'
        type: choice
        default: 'api web editor'
        options:
          - 'api web editor'
          - 'api'
          - 'web'
          - 'editor'
          - 'config'

# the workflow token can only read the repository
permissions:
  contents: read

# one deploy at a time
concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    # ARM runner: the server is an ARM machine, so the images are built natively (no slow emulation)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      AWS_REGION: ap-southeast-2
      ENVNAME: test
      DOMAIN: slidesdone.app
      NEXT_PUBLIC_GOOGLE_AUTH: 'true'
      NEXT_PUBLIC_MICROSOFT_AUTH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build, publish and restart
        run: infra/scripts/deploy.sh ${{ inputs.what }}
