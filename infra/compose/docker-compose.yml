# Runs on the server (1 GB of memory + 2 GB swap). Memory limits keep one hungry container from taking the others down.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./editor:/srv/editor:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 64m
    depends_on: [web, api]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slidesdone
      POSTGRES_DB: slidesdone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'effective_cache_size=256MB', '-c', 'work_mem=4MB', '-c', 'maintenance_work_mem=32MB', '-c', 'max_connections=40']
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slidesdone -d slidesdone']
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=300
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: 420m

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_OPTIONS: --max-old-space-size=200
    mem_limit: 256m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
