add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:4000 http://localhost:3000 https://images.unsplash.com https://images.pexels.com https://*.razorpay.com; connect-src 'self' http://localhost:4000 http://localhost:3000 https://images.unsplash.com https://images.pexels.com https://fonts.googleapis.com https://fonts.gstatic.com https://*.razorpay.com; frame-src https://*.razorpay.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\"), accelerometer=(self \"https://api.razorpay.com\"), gyroscope=(self \"https://api.razorpay.com\"), magnetometer=(self \"https://api.razorpay.com\")" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
